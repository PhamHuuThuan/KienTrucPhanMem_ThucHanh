version: '3.8'

services:
  # Eureka Server
  eureka-server:
    build: ./discovery-service
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=eureka-server

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - SERVER_PORT=8080

  # Product Service
  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      - eureka-server
      - product-db
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=product-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://product-db:3306/productdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password

  # Product Database
  product-db:
    image: mysql:8.0
    container_name: product-db
    environment:
      - MYSQL_DATABASE=productdb
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - product-db-data:/var/lib/mysql
    networks:
      - microservices-network

  # Customer Service
  customer-service:
    build: ./customer-service
    container_name: customer-service
    depends_on:
      - eureka-server
      - customer-db
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=customer-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://customer-db:3306/customerdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password

  # Customer Database
  customer-db:
    image: mysql:8.0
    container_name: customer-db
    environment:
      - MYSQL_DATABASE=customerdb
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - customer-db-data:/var/lib/mysql
    networks:
      - microservices-network

  # Order Service
  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - eureka-server
      - order-db
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=order-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://order-db:3306/orderdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password

  # Order Database
  order-db:
    image: mysql:8.0
    container_name: order-db
    environment:
      - MYSQL_DATABASE=orderdb
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - order-db-data:/var/lib/mysql
    networks:
      - microservices-network

  # Payment Service
  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - eureka-server
      - payment-db
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=payment-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:mysql://payment-db:3306/paymentdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password

  # Payment Database
  payment-db:
    image: mysql:8.0
    container_name: payment-db
    environment:
      - MYSQL_DATABASE=paymentdb
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - payment-db-data:/var/lib/mysql
    networks:
      - microservices-network

  # Inventory Service
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      - eureka-server
      - inventory-db
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=inventory-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://inventory-db:3306/inventorydb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password

  # Inventory Database
  inventory-db:
    image: mysql:8.0
    container_name: inventory-db
    environment:
      - MYSQL_DATABASE=inventorydb
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - inventory-db-data:/var/lib/mysql
    networks:
      - microservices-network

  # Shipping Service
  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    depends_on:
      - eureka-server
      - shipping-db
    networks:
      - microservices-network
    environment:
      - SPRING_APPLICATION_NAME=shipping-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - SERVER_PORT=8086
      - SPRING_DATASOURCE_URL=jdbc:mysql://shipping-db:3306/shippingdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password

  # Shipping Database
  shipping-db:
    image: mysql:8.0
    container_name: shipping-db
    environment:
      - MYSQL_DATABASE=shippingdb
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - shipping-db-data:/var/lib/mysql
    networks:
      - microservices-network

# Networks
networks:
  microservices-network:
    driver: bridge

# Volumes
volumes:
  product-db-data:
  customer-db-data:
  order-db-data:
  payment-db-data:
  inventory-db-data:
  shipping-db-data: 